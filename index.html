<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Ganancias Empresa - NN Protect (Actualizada)</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        const DollarSign = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>;
        const TrendingUp = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>;
        const Award = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>;
        const Users = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
        const PieChart = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>;

        const CalculadoraEmpresaNN = () => {
          const [niveles, setNiveles] = useState(9);
          const [directosPorNivel, setDirectosPorNivel] = useState([3,3,3,3,3,3,3,3,3]);
          const [vn, setVn] = useState(1465);
          const [vg, setVg] = useState(1465);

          // RANGOS ACTUALIZADOS
          const rangos = [
            { nombre: 'Socio', pvRequerido: 100, gvRequerido: 100, infinito: 0, bonoAvance: 0, piernaMaxima: null },
            { nombre: 'Bronce', pvRequerido: 100, gvRequerido: 1000, infinito: 0, bonoAvance: 100, piernaMaxima: null },
            { nombre: 'Plata', pvRequerido: 100, gvRequerido: 3000, infinito: 0.5, bonoAvance: 150, piernaMaxima: { porcentaje: 0.6, volumen: 1800 } },
            { nombre: 'Oro', pvRequerido: 100, gvRequerido: 5000, infinito: 0.75, bonoAvance: 200, piernaMaxima: { porcentaje: 0.6, volumen: 3000 } },
            { nombre: 'Platino', pvRequerido: 100, gvRequerido: 10000, infinito: 1.0, bonoAvance: 250, piernaMaxima: { porcentaje: 0.6, volumen: 6000 } },
            { nombre: 'Diamante', pvRequerido: 100, gvRequerido: 25000, infinito: 1.25, bonoAvance: 500, piernaMaxima: { porcentaje: 0.6, volumen: 15000 } },
            { nombre: 'Doble Diamante', pvRequerido: 100, gvRequerido: 50000, infinito: 1.5, bonoAvance: 1000, piernaMaxima: { porcentaje: 0.6, volumen: 30000 } },
            { nombre: 'Triple Diamante', pvRequerido: 100, gvRequerido: 100000, infinito: 1.75, bonoAvance: 2500, piernaMaxima: { porcentaje: 0.6, volumen: 60000 } },
            { nombre: 'Diamante Embajador', pvRequerido: 100, gvRequerido: 250000, infinito: 1.5, bonoAvance: 5000, piernaMaxima: { porcentaje: 0.6, volumen: 150000 } },
            { nombre: 'Doble Diamante Embajador', pvRequerido: 100, gvRequerido: 500000, infinito: 1.75, bonoAvance: 10000, piernaMaxima: { porcentaje: 0.6, volumen: 300000 } },
            { nombre: 'Triple Diamante Embajador', pvRequerido: 100, gvRequerido: 1000000, infinito: 2.0, bonoAvance: 25000, piernaMaxima: { porcentaje: 0.6, volumen: 600000 } }
          ];

          // PORCENTAJES UNILEVEL ACTUALIZADOS (9 niveles)
          const porcentajesUnilevel = [6, 8, 10, 12, 5, 4, 3, 2, 2];

          // PORCENTAJES MATCH ACTUALIZADOS
          const porcentajesMatchPorRango = {
            'Socio': { niveles: [], porcentajes: [] },
            'Bronce': { niveles: [], porcentajes: [] },
            'Plata': { niveles: [1], porcentajes: [5] },
            'Oro': { niveles: [1, 2], porcentajes: [10, 5] },
            'Platino': { niveles: [1, 2, 3], porcentajes: [15, 5, 5] },
            'Diamante': { niveles: [1, 2, 3, 4], porcentajes: [25, 10, 5, 5] },
            'Doble Diamante': { niveles: [1, 2, 3, 4], porcentajes: [25, 10, 5, 5] },
            'Triple Diamante': { niveles: [1, 2, 3, 4], porcentajes: [25, 10, 5, 5] },
            'Diamante Embajador': { niveles: [1, 2, 3, 4, 5], porcentajes: [25, 15, 10, 5, 1] },
            'Doble Diamante Embajador': { niveles: [1, 2, 3, 4, 5], porcentajes: [25, 15, 10, 5, 3] },
            'Triple Diamante Embajador': { niveles: [1, 2, 3, 4, 5], porcentajes: [25, 15, 10, 5, 5] }
          };

          const calcularRango = (pvTotal, gvTotal) => {
            for (let i = rangos.length - 1; i >= 0; i--) {
              if (pvTotal >= rangos[i].pvRequerido && gvTotal >= rangos[i].gvRequerido) {
                return rangos[i];
              }
            }
            return rangos[0]; // Socio por defecto
          };

          const handleNivelesChange = (newNiveles) => {
            setNiveles(newNiveles);
            const newDirectos = [...directosPorNivel];
            if (newNiveles > directosPorNivel.length) {
              for (let i = directosPorNivel.length; i < newNiveles; i++) newDirectos.push(3);
            } else {
              newDirectos.length = newNiveles;
            }
            setDirectosPorNivel(newDirectos);
          };

          const handleDirectosChange = (nivel, valor) => {
            const newDirectos = [...directosPorNivel];
            newDirectos[nivel] = parseInt(valor) || 0;
            setDirectosPorNivel(newDirectos);
          };

          const calculos = useMemo(() => {
            const estructura = [];
            let gvTotalAcumulado = vg;
            let pvTotalAcumulado = vn;
            let totalPersonas = 0;
            
            for (let nivel = 0; nivel < niveles; nivel++) {
              let personas = 1;
              for (let i = 0; i <= nivel; i++) personas *= directosPorNivel[i];
              const gvNivel = personas * vg;
              const pvNivel = personas * vn;
              gvTotalAcumulado += gvNivel;
              pvTotalAcumulado += pvNivel;
              totalPersonas += personas;
              estructura.push({ nivel: nivel + 1, personas, gvNivel, pvNivel });
            }

            const totalVentas = (totalPersonas + 1) * vn;
            let comisionesTotales = 0, comisionesUnilevelTotal = 0, comisionesInfinitoTotal = 0, comisionesMatchTotal = 0, comisionesAvanceRangoTotal = 0;
            let comisionesPorNivel = Array(niveles).fill(0);
            let unilevelPorNivel = Array(niveles).fill(0);
            let infinitoPorNivel = Array(niveles).fill(0);
            let matchPorNivel = Array(niveles).fill(0);

            const calcularComisionesPersona = (posicionNivel, profundidadDisponible) => {
              let pvPersona = vn;
              let gvPersona = vg;
              
              for (let i = 1; i <= profundidadDisponible; i++) {
                let personasEnNivel = 1;
                for (let j = posicionNivel + 1; j <= posicionNivel + i && j < niveles; j++) {
                  personasEnNivel *= directosPorNivel[j];
                }
                pvPersona += personasEnNivel * vn;
                gvPersona += personasEnNivel * vg;
              }
              
              const rangoPersona = calcularRango(pvPersona, gvPersona);
              let unilevelPersona = 0, infinitoPersona = 0, matchPersona = 0;

              // BONO UNILEVEL - SIEMPRE SE COBRA (sin necesidad de calificar a rango)
              const nivelesUnilevel = Math.min(profundidadDisponible, 9);
              for (let i = 0; i < nivelesUnilevel; i++) {
                let personasEnNivel = 1;
                for (let j = posicionNivel + 1; j <= posicionNivel + 1 + i && j < niveles; j++) {
                  personasEnNivel *= directosPorNivel[j];
                }
                const comision = personasEnNivel * vn * (porcentajesUnilevel[i] / 100);
                unilevelPersona += comision;
                const nivelAbsoluto = posicionNivel + i;
                if (nivelAbsoluto < niveles) {
                  comisionesPorNivel[nivelAbsoluto] += comision;
                  unilevelPorNivel[nivelAbsoluto] += comision;
                }
              }

              // BONO INFINITO - Solo desde Plata en adelante (nivel 10 al infinito)
              if (profundidadDisponible > 9 && rangoPersona.infinito > 0) {
                const directosInfo = [];
                const numDirectos = directosPorNivel[posicionNivel + 1] || 0;
                
                for (let d = 0; d < numDirectos; d++) {
                  let pvDirecto = vn;
                  let gvDirecto = vg;
                  
                  for (let i = 1; i <= profundidadDisponible - 1; i++) {
                    let personasEnSubnivel = 1;
                    for (let j = posicionNivel + 2; j <= posicionNivel + 1 + i && j < niveles; j++) {
                      personasEnSubnivel *= directosPorNivel[j];
                    }
                    pvDirecto += personasEnSubnivel * vn;
                    gvDirecto += personasEnSubnivel * vg;
                  }
                  
                  const rangoDirecto = calcularRango(pvDirecto, gvDirecto);
                  directosInfo.push(rangoDirecto);
                }

                directosInfo.sort((a, b) => rangos.findIndex(r => r.nombre === b.nombre) - rangos.findIndex(r => r.nombre === a.nombre));

                for (let d = 0; d < directosInfo.length; d++) {
                  const rangoDirecto = directosInfo[d];
                  const rangoIndexPersona = rangos.findIndex(r => r.nombre === rangoPersona.nombre);
                  const rangoIndexDirecto = rangos.findIndex(r => r.nombre === rangoDirecto.nombre);
                  
                  const porcentajeDiferencia = (rangoIndexPersona > rangoIndexDirecto) ? 
                    rangoPersona.infinito - rangoDirecto.infinito : rangoPersona.infinito;
                  
                  if (porcentajeDiferencia > 0) {
                    let volumenDirecto = vn;
                    for (let i = 1; i <= profundidadDisponible - 1; i++) {
                      let personasEnSubnivel = 1;
                      for (let j = posicionNivel + 2; j <= posicionNivel + 1 + i && j < niveles; j++) {
                        personasEnSubnivel *= directosPorNivel[j];
                      }
                      volumenDirecto += personasEnSubnivel * vn;
                    }
                    
                    const comisionInfinito = volumenDirecto * (porcentajeDiferencia / 100);
                    infinitoPersona += comisionInfinito;
                    
                    const nivel10Index = posicionNivel + 9;
                    if (nivel10Index < niveles) {
                      comisionesPorNivel[nivel10Index] += comisionInfinito;
                      infinitoPorNivel[nivel10Index] += comisionInfinito;
                    }
                  }
                }
              }

              // BONO MATCH - REQUIERE CALIFICACIÓN DE RANGO
              const matchConfig = porcentajesMatchPorRango[rangoPersona.nombre];
              if (matchConfig && matchConfig.niveles.length > 0) {
                const numDirectos = directosPorNivel[posicionNivel + 1] || 0;
                
                for (let d = 0; d < numDirectos && d < matchConfig.niveles.length; d++) {
                  let unilevelDirecto = 0;
                  
                  for (let i = 0; i < 9 && i < profundidadDisponible - 1; i++) {
                    let personasEnSubnivel = 1;
                    for (let j = posicionNivel + 2; j <= posicionNivel + 2 + i && j < niveles; j++) {
                      personasEnSubnivel *= directosPorNivel[j];
                    }
                    unilevelDirecto += personasEnSubnivel * vn * (porcentajesUnilevel[i] / 100);
                  }
                  
                  const comisionMatch = unilevelDirecto * (matchConfig.porcentajes[d] / 100);
                  matchPersona += comisionMatch;
                  
                  for (let i = 0; i < 5 && posicionNivel + i < niveles; i++) {
                    comisionesPorNivel[posicionNivel + i] += comisionMatch / 5;
                    matchPorNivel[posicionNivel + i] += comisionMatch / 5;
                  }
                }
              }

              return { unilevelPersona, infinitoPersona, matchPersona, rangoPersona };
            };

            // Calcular comisiones para cada persona en cada nivel
            for (let nivel = 0; nivel < niveles; nivel++) {
              let personas = 1;
              for (let i = 0; i <= nivel; i++) personas *= directosPorNivel[i];
              
              const profundidadDisponible = niveles - nivel - 1;
              const { unilevelPersona, infinitoPersona, matchPersona } = calcularComisionesPersona(nivel, profundidadDisponible);
              
              comisionesUnilevelTotal += unilevelPersona * personas;
              comisionesInfinitoTotal += infinitoPersona * personas;
              comisionesMatchTotal += matchPersona * personas;
            }

            // BONO AVANCE DE RANGO (asumiendo que cada persona avanza una vez a su máximo rango)
            // Esta es una simplificación - en realidad se paga una sola vez al alcanzar el rango
            const rangoTop = calcularRango(pvTotalAcumulado, gvTotalAcumulado);
            if (rangoTop.bonoAvance > 0) {
              comisionesAvanceRangoTotal = rangoTop.bonoAvance;
            }

            comisionesTotales = comisionesUnilevelTotal + comisionesInfinitoTotal + comisionesMatchTotal + comisionesAvanceRangoTotal;
            const gananciaNeta = totalVentas - comisionesTotales;
            const porcentajeComisiones = (comisionesTotales / totalVentas) * 100;
            const porcentajeGanancia = (gananciaNeta / totalVentas) * 100;

            return {
              estructura,
              totalPersonas,
              totalVentas,
              comisionesTotales,
              comisionesUnilevelTotal,
              comisionesInfinitoTotal,
              comisionesMatchTotal,
              comisionesAvanceRangoTotal,
              gananciaNeta,
              porcentajeComisiones,
              porcentajeGanancia,
              comisionesPorNivel,
              unilevelPorNivel,
              infinitoPorNivel,
              matchPorNivel,
              rangoAlcanzado: rangoTop.nombre
            };
          }, [niveles, directosPorNivel, vn, vg]);

          return (
            <div className="min-h-screen bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 py-8">
              <div className="container mx-auto px-4 max-w-7xl">
                <div className="text-center mb-8">
                  <h1 className="text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600 mb-2">
                    Calculadora de Ganancias Empresa
                  </h1>
                  <p className="text-xl text-gray-600">NN Protect - Plan de Compensación 2026</p>
                  <p className="text-lg text-indigo-600 font-semibold mt-2">Rango Alcanzado: {calculos.rangoAlcanzado}</p>
                </div>

                <div className="bg-white rounded-xl shadow-2xl p-6 mb-6">
                  <h2 className="text-2xl font-bold text-gray-800 mb-4">Parámetros Iniciales</h2>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                      <label className="block text-sm font-semibold text-gray-700 mb-2">Niveles de Profundidad</label>
                      <input type="number" min="1" max="20" value={niveles} onChange={(e) => handleNivelesChange(parseInt(e.target.value) || 1)} className="w-full px-4 py-3 border-2 border-blue-300 rounded-lg focus:border-blue-500 focus:outline-none text-lg font-semibold" />
                    </div>
                    <div>
                      <label className="block text-sm font-semibold text-gray-700 mb-2">VN por Persona (USD)</label>
                      <input type="number" min="0" step="10" value={vn} onChange={(e) => setVn(parseFloat(e.target.value) || 0)} className="w-full px-4 py-3 border-2 border-green-300 rounded-lg focus:border-green-500 focus:outline-none text-lg font-semibold" />
                    </div>
                    <div>
                      <label className="block text-sm font-semibold text-gray-700 mb-2">VG por Persona (USD)</label>
                      <input type="number" min="0" step="10" value={vg} onChange={(e) => setVg(parseFloat(e.target.value) || 0)} className="w-full px-4 py-3 border-2 border-purple-300 rounded-lg focus:border-purple-500 focus:outline-none text-lg font-semibold" />
                    </div>
                  </div>
                </div>

                <div className="bg-white rounded-xl shadow-2xl p-6 mb-6">
                  <h2 className="text-2xl font-bold text-gray-800 mb-4">Configurar Directos por Nivel</h2>
                  <div className="overflow-x-auto">
                    <table className="w-full">
                      <thead className="bg-blue-100">
                        <tr>
                          <th className="px-4 py-3 text-left font-semibold">Nivel</th>
                          <th className="px-4 py-3 text-center font-semibold">Directos por Persona</th>
                          <th className="px-4 py-3 text-right font-semibold">Total Personas en Nivel</th>
                        </tr>
                      </thead>
                      <tbody>
                        {directosPorNivel.map((d, idx) => (
                          <tr key={idx} className="border-b hover:bg-gray-50">
                            <td className="px-4 py-3 font-semibold text-blue-600">Nivel {idx + 1}</td>
                            <td className="px-4 py-3 text-center">
                              <input type="number" min="0" max="20" value={d} onChange={(e) => handleDirectosChange(idx, e.target.value)} className="w-24 px-3 py-2 border-2 border-blue-300 rounded-lg text-center font-semibold focus:border-blue-500 focus:outline-none" />
                            </td>
                            <td className="px-4 py-3 text-right font-semibold text-gray-700">{calculos.estructura[idx]?.personas.toLocaleString() || 0}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                  <div className="bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl shadow-xl p-6 text-white">
                    <div className="flex items-center gap-3 mb-2"><Users /><h3 className="text-lg font-semibold">Total Red</h3></div>
                    <p className="text-4xl font-bold">{calculos.totalPersonas.toLocaleString()}</p>
                    <p className="text-blue-100 text-sm mt-1">personas totales</p>
                  </div>
                  <div className="bg-gradient-to-br from-green-500 to-emerald-600 rounded-xl shadow-xl p-6 text-white">
                    <div className="flex items-center gap-3 mb-2"><TrendingUp /><h3 className="text-lg font-semibold">Total Ventas (VN)</h3></div>
                    <p className="text-4xl font-bold">${calculos.totalVentas.toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
                    <p className="text-green-100 text-sm mt-1">ingresos brutos</p>
                  </div>
                  <div className="bg-gradient-to-br from-purple-500 to-purple-600 rounded-xl shadow-xl p-6 text-white">
                    <div className="flex items-center gap-3 mb-2"><Award /><h3 className="text-lg font-semibold">Total Comisiones</h3></div>
                    <p className="text-4xl font-bold">${calculos.comisionesTotales.toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
                    <p className="text-purple-100 text-sm mt-1">{calculos.porcentajeComisiones.toFixed(2)}% de las ventas</p>
                  </div>
                </div>

                <div className="bg-gradient-to-r from-emerald-600 to-green-700 rounded-xl shadow-2xl p-8 mb-6 text-white">
                  <h2 className="text-3xl font-bold mb-4 text-center flex items-center justify-center gap-3"><DollarSign />GANANCIA NETA DE LA EMPRESA</h2>
                  <div className="text-center">
                    <p className="text-6xl font-bold mb-2">${calculos.gananciaNeta.toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
                    <p className="text-2xl font-semibold text-green-100">{calculos.porcentajeGanancia.toFixed(2)}% de margen</p>
                  </div>
                </div>

                <div className="bg-white rounded-xl shadow-xl p-6 mb-6">
                  <h3 className="text-2xl font-bold text-gray-800 mb-4 border-b-2 border-blue-500 pb-2 flex items-center gap-2">
                    <PieChart />Desglose de Comisiones por Tipo de Bono
                  </h3>
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                    {[
                      {label: 'Bono Unilevel', valor: calculos.comisionesUnilevelTotal, color: 'blue'},
                      {label: 'Bono Infinito', valor: calculos.comisionesInfinitoTotal, color: 'purple'},
                      {label: 'Bono Match', valor: calculos.comisionesMatchTotal, color: 'green'},
                      {label: 'Bono Avance Rango', valor: calculos.comisionesAvanceRangoTotal, color: 'amber'}
                    ].map((bono, i) => (
                      <div key={i} className={`bg-${bono.color}-50 p-4 rounded-lg border-l-4 border-${bono.color}-500`}>
                        <h4 className={`font-semibold text-${bono.color}-900 mb-2`}>{bono.label}</h4>
                        <p className={`text-2xl font-bold text-${bono.color}-600`}>${bono.valor.toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
                        <p className="text-sm text-gray-600 mt-1">{((bono.valor / calculos.totalVentas) * 100).toFixed(2)}% de ventas</p>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="bg-white rounded-xl shadow-xl p-6">
                  <h3 className="text-2xl font-bold text-gray-800 mb-4 border-b-2 border-blue-500 pb-2">💰 Comisiones Pagadas por Nivel</h3>
                  <div className="overflow-x-auto">
                    <table className="w-full">
                      <thead className="bg-blue-100">
                        <tr>
                          <th className="px-4 py-3 text-left font-semibold">Nivel</th>
                          <th className="px-4 py-3 text-right font-semibold">Personas</th>
                          <th className="px-4 py-3 text-right font-semibold">Unilevel</th>
                          <th className="px-4 py-3 text-right font-semibold">Infinito</th>
                          <th className="px-4 py-3 text-right font-semibold">Match</th>
                          <th className="px-4 py-3 text-right font-semibold bg-blue-200">Total Comisiones</th>
                        </tr>
                      </thead>
                      <tbody>
                        {calculos.estructura.map((est, idx) => (
                          <tr key={est.nivel} className="border-b hover:bg-gray-50">
                            <td className="px-4 py-3 font-semibold">{est.nivel}</td>
                            <td className="px-4 py-3 text-right">{est.personas.toLocaleString()}</td>
                            <td className="px-4 py-3 text-right text-blue-600">${calculos.unilevelPorNivel[idx].toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                            <td className="px-4 py-3 text-right text-purple-600">${calculos.infinitoPorNivel[idx].toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                            <td className="px-4 py-3 text-right text-green-600">${calculos.matchPorNivel[idx].toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                            <td className="px-4 py-3 text-right font-bold text-red-600 bg-gray-50">${calculos.comisionesPorNivel[idx].toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                          </tr>
                        ))}
                        <tr className="bg-blue-200 font-bold text-lg">
                          <td className="px-4 py-3">TOTAL</td>
                          <td className="px-4 py-3 text-right">{calculos.totalPersonas.toLocaleString()}</td>
                          <td className="px-4 py-3 text-right text-blue-700">${calculos.comisionesUnilevelTotal.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                          <td className="px-4 py-3 text-right text-purple-700">${calculos.comisionesInfinitoTotal.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                          <td className="px-4 py-3 text-right text-green-700">${calculos.comisionesMatchTotal.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                          <td className="px-4 py-3 text-right text-red-700 bg-blue-300">${calculos.comisionesTotales.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          );
        };

        ReactDOM.render(<CalculadoraEmpresaNN />, document.getElementById('root'));
    </script>
</body>
</html>
