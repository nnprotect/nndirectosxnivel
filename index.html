<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Ganancias Empresa - ONANO</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        const DollarSign = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>;
        const TrendingUp = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>;
        const Award = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>;
        const Users = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
        const PieChart = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>;

        const CalculadoraEmpresaONANO = () => {
          const [directos, setDirectos] = useState(3);
          const [niveles, setNiveles] = useState(12);
          const [vn, setVn] = useState(1800);
          const [vg, setVg] = useState(1800);
          const [tipoCambio, setTipoCambio] = useState(1);

          // RANGOS ACTUALIZADOS
          const rangos = [
            { nombre: 'Socio', pvRequerido: 100, gvRequerido: 100, infinito: 0, bonoAvance: 0 },
            { nombre: 'Bronce', pvRequerido: 100, gvRequerido: 1000, infinito: 0, bonoAvance: 100 },
            { nombre: 'Plata', pvRequerido: 100, gvRequerido: 3000, infinito: 0, bonoAvance: 150 },
            { nombre: 'Oro', pvRequerido: 100, gvRequerido: 5000, infinito: 0, bonoAvance: 200 },
            { nombre: 'Platino', pvRequerido: 100, gvRequerido: 10000, infinito: 0.5, bonoAvance: 250 },
            { nombre: 'Diamante', pvRequerido: 100, gvRequerido: 25000, infinito: 0.75, bonoAvance: 500 },
            { nombre: 'Doble Diamante', pvRequerido: 100, gvRequerido: 50000, infinito: 1.0, bonoAvance: 1000 },
            { nombre: 'Triple Diamante', pvRequerido: 100, gvRequerido: 100000, infinito: 1.25, bonoAvance: 2500 },
            { nombre: 'Diamante Embajador', pvRequerido: 100, gvRequerido: 250000, infinito: 1.5, bonoAvance: 5000 },
            { nombre: 'Doble Diamante Embajador', pvRequerido: 100, gvRequerido: 500000, infinito: 1.75, bonoAvance: 10000 },
            { nombre: 'Triple Diamante Embajador', pvRequerido: 100, gvRequerido: 1000000, infinito: 2.0, bonoAvance: 25000 }
          ];

          const porcentajesUnilevel = [6, 8, 10, 12, 5, 4, 3, 2, 2];

          const porcentajesMatchPorRango = {
            'Socio': { niveles: [], porcentajes: [] },
            'Bronce': { niveles: [], porcentajes: [] },
            'Plata': { niveles: [1], porcentajes: [5] },
            'Oro': { niveles: [1], porcentajes: [10] },
            'Platino': { niveles: [1], porcentajes: [15] },
            'Diamante': { niveles: [1, 2], porcentajes: [25, 5] },
            'Doble Diamante': { niveles: [1, 2, 3], porcentajes: [25, 10, 5] },
            'Triple Diamante': { niveles: [1, 2, 3, 4], porcentajes: [25, 10, 10, 5] },
            'Diamante Embajador': { niveles: [1, 2, 3, 4, 5], porcentajes: [25, 15, 10, 5, 1] },
            'Doble Diamante Embajador': { niveles: [1, 2, 3, 4, 5], porcentajes: [25, 15, 10, 5, 3] },
            'Triple Diamante Embajador': { niveles: [1, 2, 3, 4, 5], porcentajes: [25, 15, 10, 5, 5] }
          };

          const calcularRango = (pvTotal, gvTotal) => {
            for (let i = rangos.length - 1; i >= 0; i--) {
              if (pvTotal >= rangos[i].pvRequerido && gvTotal >= rangos[i].gvRequerido) {
                return rangos[i];
              }
            }
            return rangos[0];
          };

          const calculos = useMemo(() => {
            const estructura = [];
            let pvTotalAcumulado = vn;
            let gvTotalAcumulado = vg;
            
            for (let nivel = 1; nivel <= niveles; nivel++) {
              const personas = Math.pow(directos, nivel);
              estructura.push({ 
                nivel, 
                personas, 
                pvNivel: personas * vn,
                gvNivel: personas * vg 
              });
              pvTotalAcumulado += personas * vn;
              gvTotalAcumulado += personas * vg;
            }

            const totalPersonas = estructura.reduce((sum, e) => sum + e.personas, 1);
            const totalVentas = totalPersonas * vn;

            let comisionesUnilevelTotal = 0;
            let comisionesInfinitoTotal = 0;
            let comisionesMatchTotal = 0;
            let comisionesAvanceRangoTotal = 0;

            let unilevelPorNivel = Array(niveles).fill(0);
            let infinitoPorNivel = Array(niveles).fill(0);
            let matchPorNivel = Array(niveles).fill(0);
            
            // Contador de personas por rango para avance
            const personasPorRango = {};
            rangos.forEach(r => personasPorRango[r.nombre] = 0);

            // CALCULAR COMISIONES PARA CADA PERSONA EN CADA NIVEL
            for (let nivelPersona = 0; nivelPersona <= niveles; nivelPersona++) {
              const personasEnEsteNivel = nivelPersona === 0 ? 1 : estructura[nivelPersona - 1].personas;
              const profundidadDisponible = niveles - nivelPersona;

              for (let p = 0; p < personasEnEsteNivel; p++) {
                let pvPersona = vn;
                let gvPersona = vg;

                for (let i = 1; i <= profundidadDisponible; i++) {
                  const personasSubnivel = Math.pow(directos, i);
                  pvPersona += personasSubnivel * vn;
                  gvPersona += personasSubnivel * vg;
                }

                const rangoPersona = calcularRango(pvPersona, gvPersona);
                
                // Contar persona por rango
                personasPorRango[rangoPersona.nombre]++;

                // === BONO UNILEVEL ===
                for (let i = 0; i < Math.min(profundidadDisponible, 9); i++) {
                  const personasEnNivel = Math.pow(directos, i + 1);
                  const comision = personasEnNivel * vn * (porcentajesUnilevel[i] / 100);
                  comisionesUnilevelTotal += comision;
                  
                  const nivelAbsoluto = nivelPersona + i + 1;
                  if (nivelAbsoluto <= niveles) {
                    unilevelPorNivel[nivelAbsoluto - 1] += comision;
                  }
                }

                // === BONO INFINITO ===
                // IMPORTANTE: Se cobra directamente el porcentaje del infinito sobre TODAS las personas
                // del nivel 10 en adelante, SIN considerar breakaway en estructuras uniformes
                if (profundidadDisponible > 9 && rangoPersona.infinito > 0) {
                  for (let i = 9; i < profundidadDisponible; i++) {
                    const personasEnNivel = Math.pow(directos, i + 1);
                    const comision = personasEnNivel * vn * (rangoPersona.infinito / 100);
                    comisionesInfinitoTotal += comision;
                    
                    const nivelAbsoluto = nivelPersona + i + 1;
                    if (nivelAbsoluto <= niveles) {
                      infinitoPorNivel[nivelAbsoluto - 1] += comision;
                    }
                  }
                }

                // === BONO MATCH ===
                const matchConfig = porcentajesMatchPorRango[rangoPersona.nombre];
                
                if (matchConfig && matchConfig.niveles.length > 0) {
                  for (let i = 0; i < matchConfig.niveles.length && i < profundidadDisponible; i++) {
                    const nivelProfundidad = i + 1;
                    const personasEnNivel = Math.pow(directos, nivelProfundidad);
                    const porcentajeMatch = matchConfig.porcentajes[i];
                    
                    const profundidadDisponibleParaCadaPersona = profundidadDisponible - nivelProfundidad;
                    
                    if (profundidadDisponibleParaCadaPersona >= 1) {
                      let bonoUnilevelPorPersona = 0;
                      
                      const nivelesUnilevelDisponibles = Math.min(profundidadDisponibleParaCadaPersona, 9);
                      for (let k = 0; k < nivelesUnilevelDisponibles; k++) {
                        const personasSubnivel = Math.pow(directos, k + 1);
                        bonoUnilevelPorPersona += personasSubnivel * vn * (porcentajesUnilevel[k] / 100);
                      }
                      
                      if (profundidadDisponibleParaCadaPersona > 9) {
                        let pvPersonaEnNivel = vn;
                        let gvPersonaEnNivel = vg;
                        
                        for (let k = 1; k <= profundidadDisponibleParaCadaPersona; k++) {
                          const personasSubnivel = Math.pow(directos, k);
                          pvPersonaEnNivel += personasSubnivel * vn;
                          gvPersonaEnNivel += personasSubnivel * vg;
                        }
                        
                        const rangoPersonaEnNivel = calcularRango(pvPersonaEnNivel, gvPersonaEnNivel);
                        
                        if (rangoPersonaEnNivel.infinito > 0) {
                          for (let k = 9; k < profundidadDisponibleParaCadaPersona; k++) {
                            const personasSubnivel = Math.pow(directos, k + 1);
                            bonoUnilevelPorPersona += personasSubnivel * vn * (rangoPersonaEnNivel.infinito / 100);
                          }
                        }
                      }
                      
                      const comisionMatch = personasEnNivel * bonoUnilevelPorPersona * (porcentajeMatch / 100);
                      comisionesMatchTotal += comisionMatch;
                      
                      const nivelAbsoluto = nivelPersona + nivelProfundidad;
                      if (nivelAbsoluto <= niveles) {
                        matchPorNivel[nivelAbsoluto - 1] += comisionMatch / personasEnNivel;
                      }
                    }
                  }
                }
              }
            }

            // === BONO AVANCE DE RANGO ===
            const desgloseavanceRango = [];
            rangos.forEach(rango => {
              if (rango.bonoAvance > 0 && personasPorRango[rango.nombre] > 0) {
                const bonoPorPersona = rango.bonoAvance * tipoCambio;
                const totalBono = personasPorRango[rango.nombre] * bonoPorPersona;
                comisionesAvanceRangoTotal += totalBono;
                desgloseavanceRango.push({
                  rango: rango.nombre,
                  personas: personasPorRango[rango.nombre],
                  bonoUSD: rango.bonoAvance,
                  bonoPorPersona,
                  totalBono
                });
              }
            });

            const comisionesTotales = comisionesUnilevelTotal + comisionesInfinitoTotal + comisionesMatchTotal + comisionesAvanceRangoTotal;
            const comisionesPorNivel = unilevelPorNivel.map((u, i) => u + infinitoPorNivel[i] + matchPorNivel[i]);
            const gananciaNeta = totalVentas - comisionesTotales;
            const porcentajeComisiones = (comisionesTotales / totalVentas) * 100;
            const porcentajeGanancia = (gananciaNeta / totalVentas) * 100;

            return {
              estructura,
              totalPersonas,
              totalVentas,
              comisionesTotales,
              comisionesUnilevelTotal,
              comisionesInfinitoTotal,
              comisionesMatchTotal,
              comisionesAvanceRangoTotal,
              gananciaNeta,
              porcentajeComisiones,
              porcentajeGanancia,
              comisionesPorNivel,
              unilevelPorNivel,
              infinitoPorNivel,
              matchPorNivel,
              desgloseavanceRango
            };
          }, [directos, niveles, vn, vg, tipoCambio]);

          return (
            <div className="min-h-screen bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 py-8">
              <div className="container mx-auto px-4 max-w-7xl">
                <div className="text-center mb-8">
                  <h1 className="text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600 mb-2">
                    Calculadora de Ganancias Empresa
                  </h1>
                  <p className="text-xl text-gray-600">ONANO - Plan de Compensación 2026</p>
                </div>

                <div className="bg-white rounded-xl shadow-2xl p-6 mb-6">
                  <h2 className="text-2xl font-bold text-gray-800 mb-4">Parámetros de Simulación</h2>
                  <div className="grid grid-cols-1 md:grid-cols-5 gap-6">
                    <div>
                      <label className="block text-sm font-semibold text-gray-700 mb-2">Directos por Persona</label>
                      <input type="number" min="1" max="20" value={directos} onChange={(e) => setDirectos(parseInt(e.target.value) || 1)} className="w-full px-4 py-3 border-2 border-blue-300 rounded-lg focus:border-blue-500 focus:outline-none text-lg font-semibold" />
                    </div>
                    <div>
                      <label className="block text-sm font-semibold text-gray-700 mb-2">Niveles de Profundidad</label>
                      <input type="number" min="1" max="20" value={niveles} onChange={(e) => setNiveles(parseInt(e.target.value) || 1)} className="w-full px-4 py-3 border-2 border-blue-300 rounded-lg focus:border-blue-500 focus:outline-none text-lg font-semibold" />
                    </div>
                    <div>
                      <label className="block text-sm font-semibold text-gray-700 mb-2">CV por Persona</label>
                      <input type="number" min="0" step="10" value={vn} onChange={(e) => setVn(parseFloat(e.target.value) || 0)} className="w-full px-4 py-3 border-2 border-green-300 rounded-lg focus:border-green-500 focus:outline-none text-lg font-semibold" />
                    </div>
                    <div>
                      <label className="block text-sm font-semibold text-gray-700 mb-2">GV por Persona</label>
                      <input type="number" min="0" step="10" value={vg} onChange={(e) => setVg(parseFloat(e.target.value) || 0)} className="w-full px-4 py-3 border-2 border-purple-300 rounded-lg focus:border-purple-500 focus:outline-none text-lg font-semibold" />
                    </div>
                    <div>
                      <label className="block text-sm font-semibold text-gray-700 mb-2">Tipo de Cambio</label>
                      <input type="number" min="0" step="0.01" value={tipoCambio} onChange={(e) => setTipoCambio(parseFloat(e.target.value) || 1)} className="w-full px-4 py-3 border-2 border-orange-300 rounded-lg focus:border-orange-500 focus:outline-none text-lg font-semibold" />
                      <p className="text-xs text-gray-500 mt-1">USD a moneda local</p>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                  <div className="bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl shadow-xl p-6 text-white">
                    <div className="flex items-center gap-3 mb-2"><Users /><h3 className="text-lg font-semibold">Total Red</h3></div>
                    <p className="text-4xl font-bold">{calculos.totalPersonas.toLocaleString()}</p>
                    <p className="text-blue-100 text-sm mt-1">personas totales</p>
                  </div>
                  <div className="bg-gradient-to-br from-green-500 to-emerald-600 rounded-xl shadow-xl p-6 text-white">
                    <div className="flex items-center gap-3 mb-2"><TrendingUp /><h3 className="text-lg font-semibold">Total Ventas (CV)</h3></div>
                    <p className="text-4xl font-bold">${calculos.totalVentas.toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
                    <p className="text-green-100 text-sm mt-1">ingresos brutos</p>
                  </div>
                  <div className="bg-gradient-to-br from-purple-500 to-purple-600 rounded-xl shadow-xl p-6 text-white">
                    <div className="flex items-center gap-3 mb-2"><Award /><h3 className="text-lg font-semibold">Total Comisiones</h3></div>
                    <p className="text-4xl font-bold">${calculos.comisionesTotales.toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
                    <p className="text-purple-100 text-sm mt-1">{calculos.porcentajeComisiones.toFixed(2)}% de las ventas</p>
                  </div>
                </div>

                <div className="bg-gradient-to-r from-emerald-600 to-green-700 rounded-xl shadow-2xl p-8 mb-6 text-white">
                  <h2 className="text-3xl font-bold mb-4 text-center flex items-center justify-center gap-3"><DollarSign />GANANCIA NETA DE LA EMPRESA</h2>
                  <div className="text-center">
                    <p className="text-6xl font-bold mb-2">${calculos.gananciaNeta.toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
                    <p className="text-2xl font-semibold text-green-100">{calculos.porcentajeGanancia.toFixed(2)}% de margen</p>
                  </div>
                </div>

                <div className="bg-white rounded-xl shadow-xl p-6 mb-6">
                  <h3 className="text-2xl font-bold text-gray-800 mb-4 border-b-2 border-blue-500 pb-2 flex items-center gap-2">
                    <PieChart />Desglose de Comisiones por Tipo de Bono
                  </h3>
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                    {[
                      {label: 'Bono Unilevel', valor: calculos.comisionesUnilevelTotal, color: 'blue'},
                      {label: 'Bono Infinito', valor: calculos.comisionesInfinitoTotal, color: 'purple'},
                      {label: 'Bono Match', valor: calculos.comisionesMatchTotal, color: 'green'},
                      {label: 'Bono Avance Rango', valor: calculos.comisionesAvanceRangoTotal, color: 'amber'}
                    ].map((bono, i) => (
                      <div key={i} className={`bg-${bono.color}-50 p-4 rounded-lg border-l-4 border-${bono.color}-500`}>
                        <h4 className={`font-semibold text-${bono.color}-900 mb-2`}>{bono.label}</h4>
                        <p className={`text-2xl font-bold text-${bono.color}-600`}>${bono.valor.toLocaleString(undefined, {minimumFractionDigits: 2})}</p>
                        <p className="text-sm text-gray-600 mt-1">{((bono.valor / calculos.totalVentas) * 100).toFixed(2)}% de ventas</p>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="bg-white rounded-xl shadow-xl p-6 mb-6">
                  <h3 className="text-2xl font-bold text-gray-800 mb-4 border-b-2 border-indigo-500 pb-2">🏆 Tabla de Rangos y Bonos</h3>
                  <div className="overflow-x-auto">
                    <table className="w-full">
                      <thead className="bg-indigo-100">
                        <tr>
                          <th className="px-4 py-3 text-left font-semibold">Rango</th>
                          <th className="px-4 py-3 text-right font-semibold">CV Requerido</th>
                          <th className="px-4 py-3 text-right font-semibold">GV Requerido</th>
                          <th className="px-4 py-3 text-right font-semibold">Infinito %</th>
                          <th className="px-4 py-3 text-right font-semibold">Bono USD</th>
                          <th className="px-4 py-3 text-right font-semibold">Bono Convertido</th>
                        </tr>
                      </thead>
                      <tbody>
                        {rangos.map((rango, idx) => (
                          <tr key={idx} className="border-b hover:bg-gray-50">
                            <td className="px-4 py-3 font-semibold">{rango.nombre}</td>
                            <td className="px-4 py-3 text-right">{rango.pvRequerido.toLocaleString()}</td>
                            <td className="px-4 py-3 text-right">{rango.gvRequerido.toLocaleString()}</td>
                            <td className="px-4 py-3 text-right text-purple-600 font-semibold">{rango.infinito > 0 ? `${rango.infinito}%` : '-'}</td>
                            <td className="px-4 py-3 text-right text-gray-600">{rango.bonoAvance > 0 ? `$${rango.bonoAvance.toLocaleString()}` : '-'}</td>
                            <td className="px-4 py-3 text-right text-green-600 font-bold">{rango.bonoAvance > 0 ? `$${(rango.bonoAvance * tipoCambio).toLocaleString(undefined, {minimumFractionDigits: 2})}` : '-'}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                {calculos.desgloseavanceRango.length > 0 && (
                  <div className="bg-white rounded-xl shadow-xl p-6 mb-6">
                    <h3 className="text-2xl font-bold text-gray-800 mb-4 border-b-2 border-amber-500 pb-2">🎖️ Desglose de Bonos por Avance de Rango</h3>
                    <div className="overflow-x-auto">
                      <table className="w-full">
                        <thead className="bg-amber-100">
                          <tr>
                            <th className="px-4 py-3 text-left font-semibold">Rango</th>
                            <th className="px-4 py-3 text-right font-semibold">Personas</th>
                            <th className="px-4 py-3 text-right font-semibold">Bono USD</th>
                            <th className="px-4 py-3 text-right font-semibold">Bono Convertido</th>
                            <th className="px-4 py-3 text-right font-semibold">Total Pagado</th>
                          </tr>
                        </thead>
                        <tbody>
                          {calculos.desgloseavanceRango.map((item, idx) => (
                            <tr key={idx} className="border-b hover:bg-gray-50">
                              <td className="px-4 py-3 font-semibold">{item.rango}</td>
                              <td className="px-4 py-3 text-right">{item.personas.toLocaleString()}</td>
                              <td className="px-4 py-3 text-right text-gray-600">${item.bonoUSD.toLocaleString()}</td>
                              <td className="px-4 py-3 text-right text-green-600 font-semibold">${item.bonoPorPersona.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                              <td className="px-4 py-3 text-right font-bold text-amber-600">${item.totalBono.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                <div className="bg-white rounded-xl shadow-xl p-6">
                  <h3 className="text-2xl font-bold text-gray-800 mb-4 border-b-2 border-blue-500 pb-2">💰 Comisiones Pagadas por Nivel</h3>
                  <div className="overflow-x-auto">
                    <table className="w-full">
                      <thead className="bg-blue-100">
                        <tr>
                          <th className="px-4 py-3 text-left font-semibold">Nivel</th>
                          <th className="px-4 py-3 text-right font-semibold">Personas</th>
                          <th className="px-4 py-3 text-right font-semibold">Unilevel</th>
                          <th className="px-4 py-3 text-right font-semibold">Infinito</th>
                          <th className="px-4 py-3 text-right font-semibold">Match</th>
                          <th className="px-4 py-3 text-right font-semibold">Avance Rango</th>
                          <th className="px-4 py-3 text-right font-semibold bg-blue-200">Total Comisiones</th>
                        </tr>
                      </thead>
                      <tbody>
                        {calculos.estructura.map((est, idx) => (
                          <tr key={est.nivel} className="border-b hover:bg-gray-50">
                            <td className="px-4 py-3 font-semibold">{est.nivel}</td>
                            <td className="px-4 py-3 text-right">{est.personas.toLocaleString()}</td>
                            <td className="px-4 py-3 text-right text-blue-600">${calculos.unilevelPorNivel[idx].toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                            <td className="px-4 py-3 text-right text-purple-600">${calculos.infinitoPorNivel[idx].toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                            <td className="px-4 py-3 text-right text-green-600">${calculos.matchPorNivel[idx].toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                            <td className="px-4 py-3 text-right text-amber-600">-</td>
                            <td className="px-4 py-3 text-right font-bold text-red-600 bg-gray-50">${calculos.comisionesPorNivel[idx].toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                          </tr>
                        ))}
                        <tr className="bg-blue-200 font-bold text-lg">
                          <td className="px-4 py-3">TOTAL</td>
                          <td className="px-4 py-3 text-right">{calculos.totalPersonas.toLocaleString()}</td>
                          <td className="px-4 py-3 text-right text-blue-700">${calculos.comisionesUnilevelTotal.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                          <td className="px-4 py-3 text-right text-purple-700">${calculos.comisionesInfinitoTotal.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                          <td className="px-4 py-3 text-right text-green-700">${calculos.comisionesMatchTotal.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                          <td className="px-4 py-3 text-right text-amber-700">${calculos.comisionesAvanceRangoTotal.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                          <td className="px-4 py-3 text-right text-red-700 bg-blue-300">${calculos.comisionesTotales.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          );
        };

        ReactDOM.render(<CalculadoraEmpresaONANO />, document.getElementById('root'));
    </script>
</body>
</html>
